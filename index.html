<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10BIPS</title>
<meta name="description" content="10BIPS — quantifying event contracts.">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0b'/%3E%3Cg fill='%23f4f1ea'%3E%3Crect x='3' y='12' width='2.5' height='14'/%3E%3Crect x='9' y='12' width='2.5' height='14'/%3E%3Crect x='15' y='12' width='2.5' height='14'/%3E%3Crect x='21' y='12' width='2.5' height='14'/%3E%3C/g%3E%3Crect x='27' y='6' width='3' height='20' fill='%238A2B18'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400&family=Playfair+Display:ital,wght@0,400..700;1,400..500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0b;
    --cream:#f4f1ea;
    --muted:#b0aca4;
    --accent:#8A2B18;
    --gutter:clamp(24px, 4.2vw, 68px);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}

  body{
    background:var(--ink);
    color:var(--cream);
    font-family:"Playfair Display",Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow:hidden;
  }

  /* ── drifting pinstripe field ──────────────────────────────── */
  #field{
    position:fixed;
    inset:0;
    z-index:0;
    width:100%;
    height:100%;
    display:block;
    pointer-events:none;
  }
  /* vignette keeps the type sitting on true black */
  .glow{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:radial-gradient(120% 90% at 8% 88%, rgba(10,10,11,.92) 0%, rgba(10,10,11,.55) 38%, transparent 72%);
  }

  /* ── layout ────────────────────────────────────────────────── */
  .page{
    position:relative;
    z-index:2;
    height:100%;
    /* svh keeps the hero anchored while mobile browser chrome slides away */
    display:flex;
    flex-direction:column;
    padding:
      calc(clamp(28px,4vw,62px) + env(safe-area-inset-top))
      calc(var(--gutter) + env(safe-area-inset-right))
      calc(clamp(36px,5.5vw,84px) + env(safe-area-inset-bottom))
      calc(var(--gutter) + env(safe-area-inset-left));
  }

  @supports (height:100svh){ .page{height:100svh} }

  /* ── mark ──────────────────────────────────────────────────── */
  .mark{
    display:flex;
    align-items:baseline;                      /* svg baseline is its bottom edge, so text sits on the bars' floor */
    gap:clamp(16px,1.9vw,29px);
    text-decoration:none;
    color:inherit;
    width:max-content;
  }
  .mark svg{display:block;height:clamp(22px,2.3vw,34px);width:auto}
  .wordmark{
    font-size:clamp(15px,1.5vw,23px);
    font-variant-numeric:lining-nums;          /* Playfair defaults to oldstyle figures */
    font-feature-settings:"lnum" 1;
    font-weight:500;
    letter-spacing:.34em;
    text-indent:.34em;
    line-height:1;
    color:var(--cream);
    white-space:nowrap;
  }

  /* ── hero ──────────────────────────────────────────────────── */
  main{margin-top:auto}

  h1{
    font-size:clamp(46px,9.4vw,152px);
    font-weight:500;
    line-height:.98;
    letter-spacing:-.015em;
    margin-bottom:clamp(30px,4.4vw,68px);
    max-width:16ch;
  }
  /* each line rides up from behind its own edge; padding keeps descenders */
  .ln{
    display:block;
    overflow:hidden;
    padding-bottom:.14em;
    margin-bottom:-.14em;
  }

  .contact{
    display:inline-block;
    font-family:"Geist",system-ui,-apple-system,"Helvetica Neue",sans-serif;
    font-size:clamp(14px,1.15vw,18px);
    font-weight:400;
    letter-spacing:.01em;
    color:var(--muted);
    text-decoration:none;
    padding:6px 0;
    transition:color .35s ease;
  }
  .contact:hover,
  .contact:focus-visible{color:var(--cream)}
  .contact:focus-visible{outline:1px solid rgba(244,241,234,.45);outline-offset:8px}

  /* ── mobile ────────────────────────────────────────────────── */
  @media (max-width:760px){
    .page{padding-bottom:calc(44px + env(safe-area-inset-bottom))}
    .mark{gap:12px}
    .mark svg{height:21px}
    .wordmark{font-size:13px;letter-spacing:.3em;text-indent:.3em}

    h1{
      font-size:clamp(44px,13vw,86px);
      line-height:1.03;
      letter-spacing:-.018em;
      max-width:9ch;
      margin-bottom:34px;
    }
    h1 br{display:none}          /* let it find its own line breaks */

    .contact{
      font-size:clamp(13px,3.6vw,15px);
      padding:10px 0;            /* taller tap target */
    }
    .glow{
      background:radial-gradient(150% 60% at 0% 92%, rgba(10,10,11,.94) 0%, rgba(10,10,11,.6) 45%, transparent 78%);
    }
  }

  /* short landscape phones: pull the scale back so it all fits */
  @media (max-height:520px) and (orientation:landscape){
    h1{font-size:clamp(34px,7vw,60px);margin-bottom:20px}
    .contact{font-size:13px;padding:4px 0}
    .page{padding-top:22px;padding-bottom:26px}
  }

  /* ── entrance ──────────────────────────────────────────────── */
  @media (prefers-reduced-motion:no-preference){
    .mark{animation:fade 1s ease .1s both}
    .ln>span{display:block;animation:rise 1.05s cubic-bezier(.19,1,.22,1) both}
    .ln:nth-child(1)>span{animation-delay:.18s}
    .ln:nth-child(2)>span{animation-delay:.30s}
    .contact{animation:fade 1s ease .62s both}
    @keyframes rise{from{transform:translateY(105%)}to{transform:none}}
    @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  }
  @media (prefers-reduced-motion:reduce){
    .mark{animation:fade 1s ease .1s both}
    .ln>span{display:block;animation:fade 1s ease both}
    .ln:nth-child(1)>span{animation-delay:.18s}
    .ln:nth-child(2)>span{animation-delay:.30s}
    .contact{animation:fade 1s ease .62s both}
    @keyframes fade{from{opacity:0}to{opacity:1}}
  }
</style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="glow" aria-hidden="true"></div>

  <div class="page">
    <header>
      <a class="mark" href="/" aria-label="10BIPS — home">
        <svg viewBox="0 0 80.4 38" aria-hidden="true">
          <g fill="#f4f1ea">
            <rect x="0" y="16" width="2.7" height="22"/>
            <rect x="7" y="16" width="2.7" height="22"/>
            <rect x="14" y="16" width="2.7" height="22"/>
            <rect x="21" y="16" width="2.7" height="22"/>
            <rect x="28" y="16" width="2.7" height="22"/>
            <rect x="35" y="16" width="2.7" height="22"/>
            <rect x="42" y="16" width="2.7" height="22"/>
            <rect x="49" y="16" width="2.7" height="22"/>
            <rect x="56" y="16" width="2.7" height="22"/>
            <rect x="63" y="16" width="2.7" height="22"/>
            <rect x="70" y="16" width="2.7" height="22"/>
          </g>
          <rect x="77" y="0" width="3.4" height="38" fill="#8A2B18"/>
        </svg>
        <span class="wordmark">10BIPS</span>
      </a>
    </header>

    <main>
      <h1><span class="ln"><span>Quantifying</span></span><span class="ln"><span>event contracts.</span></span></h1>
      <a class="contact" href="mailto:contact@10bips.com">contact@10bips.com</a>
    </main>
  </div>

<script>
(function(){
  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');
  var still = window.matchMedia('(prefers-reduced-motion: reduce)');

  var W = 0, H = 0, mobile = false;
  var lines = [];

  // tuning
  var SPEED_D = 200, SPEED_M = 150;    // px/s — paired with the spawn rate to hold a ~40px pitch
  var MIN_GAP = 100, MAX_GAP = 300;    // ms between new lines
  var WARM_ODDS = 0.07;                // share of lines that come in orange
  var COLD_A = 0.115, WARM_A = 0.9;    // peak opacity (the deeper accent needs more of it)

  // a reduce-motion preference calms the drift rather than killing it:
  // low-contrast, constant-velocity background motion, no parallax, no entrance jumps
  var CALM = 0.4;
  function speed(){ return (mobile ? SPEED_M : SPEED_D) * (still.matches ? CALM : 1); }

  // lines are invisible on the left, strongest at the right edge
  function fade(x){
    var t = x / W;
    var start = mobile ? 0.22 : 0.30;
    var full  = mobile ? 0.78 : 0.82;
    if (t <= start) return 0;
    if (t >= full)  return 1;
    return (t - start) / (full - start);
  }

  function makeLine(x){
    return { x: x, warm: Math.random() < WARM_ODDS };
  }

  function resize(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    mobile = W <= 760;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // start with a full field so the page never opens bare
  function seed(){
    lines.length = 0;
    var avgGap = speed() * ((MIN_GAP + MAX_GAP) / 2) / 1000;
    for (var x = 0; x < W + avgGap; x += avgGap * (0.6 + Math.random() * 0.8)){
      lines.push(makeLine(x));
    }
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < lines.length; i++){
      var l = lines[i];
      var a = fade(l.x);
      if (a <= 0) continue;
      var x = Math.round(l.x) + 0.5;
      if (l.warm){
        // the odd warm thread, feathered top and bottom
        var g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0,    'rgba(138,43,24,0)');
        g.addColorStop(0.22, 'rgba(138,43,24,' + (a * WARM_A) + ')');
        g.addColorStop(0.78, 'rgba(138,43,24,' + (a * WARM_A) + ')');
        g.addColorStop(1,    'rgba(138,43,24,0)');
        ctx.fillStyle = g;
      } else {
        ctx.fillStyle = 'rgba(255,255,255,' + (a * COLD_A) + ')';
      }
      ctx.fillRect(x, 0, 1, H);
    }
  }

  var last = 0, untilNext = 0;

  function frame(now){
    var dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
    last = now;

    // drift everything left, drop what has left the stage
    var dx = speed() * dt;
    var kept = [];
    for (var i = 0; i < lines.length; i++){
      lines[i].x -= dx;
      if (lines[i].x > -2) kept.push(lines[i]);
    }
    lines = kept;

    // a new line enters from the right every 0.1–0.3s
    untilNext -= dt * 1000;
    if (untilNext <= 0){
      lines.push(makeLine(W + 1));
      untilNext = MIN_GAP + Math.random() * (MAX_GAP - MIN_GAP);
    }

    draw();
    requestAnimationFrame(frame);
  }

  var running = false;
  function boot(){
    resize();
    seed();
    if (running) return;
    running = true;
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function(){
    var before = W;
    resize();
    if (!before) seed();
  });
  boot();
})();
</script>
</body>
</html>
